<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Produtos | Artes Polaroids</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<div id="site-header"></div>

<section class="page-hero">
  <div class="container">
    <span class="section-eyebrow">Catálogo</span>
    <h1>Nossos produtos</h1>
    <p>Cada peça é produzida com as suas fotos e muito cuidado. Escolha sua favorita e crie uma lembrança única.</p>
  </div>
</section>

<section class="section" style="padding-top:0;">
  <div class="container">
    <div class="category-tabs" id="categoryTabs"></div>
    <div class="product-grid" id="productGrid"></div>
  </div>
</section>

<div id="site-footer"></div>

<script src="js/products.js"></script>
<script src="js/cart.js"></script>
<script src="js/main.js"></script>
<script>
  renderHeader('produtos');
  renderFooter();

  let activeCategory = 'Todos';

  function renderCategoryTabs(){
    document.getElementById('categoryTabs').innerHTML = CATEGORIES.map(cat => `
      <button class="category-tab ${cat === activeCategory ? 'active' : ''}" data-cat="${cat}">${cat}</button>
    `).join('');
    document.querySelectorAll('.category-tab').forEach(btn => {
      btn.addEventListener('click', () => {
        activeCategory = btn.dataset.cat;
        renderCategoryTabs();
        renderGrid();
      });
    });
  }

  function renderGrid(){
    const list = activeCategory === 'Todos' ? PRODUCTS : PRODUCTS.filter(p => p.category === activeCategory);
    document.getElementById('productGrid').innerHTML = list.map(p => `
      <a href="produto.html?id=${p.id}" class="product-card fade-in">
        <div class="product-thumb">
          ${p.isNew ? '<span class="badge-new">Novidade</span>' : ''}
          ${p.icon}
        </div>
        <div class="product-info">
          <div class="product-category">${p.category}</div>
          <h3>${p.name}</h3>
          <p class="desc">${p.shortDesc}</p>
          <div class="product-price-row">
            <span class="product-price">${formatBRL(p.price)}</span>
          </div>
        </div>
      </a>
    `).join('');
  }

  renderCategoryTabs();
  renderGrid();
</script>
</body>
</html>
