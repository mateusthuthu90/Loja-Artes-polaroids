<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title id="pageTitle">Produto | Artes Polaroids</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<div id="site-header"></div>

<section class="section" style="padding-top:32px;">
  <div class="container">
    <div class="breadcrumb">
      <a href="index.html">Início</a> / <a href="produtos.html">Produtos</a> / <span id="breadcrumbName"></span>
    </div>

    <div class="product-detail" id="productDetail">
      <!-- preenchido via JS -->
    </div>

    <div id="detailFull" class="detail-full-section"></div>
  </div>
</section>

<!-- PRODUTOS RELACIONADOS -->
<section class="section section-soft">
  <div class="container">
    <div class="section-header">
      <span class="section-eyebrow">Você também pode gostar</span>
      <h2 class="section-title">Outras lembranças</h2>
    </div>
    <div class="product-grid" id="relatedGrid"></div>
  </div>
</section>

<div id="site-footer"></div>

<script src="js/products.js"></script>
<script src="js/cart.js"></script>
<script src="js/main.js"></script>
<script>
  renderHeader('produtos');
  renderFooter();

  const params = new URLSearchParams(window.location.search);
  const productId = params.get('id');
  const product = findProduct(productId) || PRODUCTS[0];

  document.getElementById('pageTitle').textContent = `${product.name} | Artes Polaroids`;
  document.getElementById('breadcrumbName').textContent = product.name;

  let selectedOptions = {};
  Object.keys(product.options || {}).forEach(key => {
    selectedOptions[key] = product.options[key][0];
  });

  const hasTiers = !!(product.tiers && product.tiers.length);
  let selectedTier = hasTiers ? product.tiers[0] : null;
  let quantity = 1;

  const galleryImages = (product.images && product.images.length) ? product.images : null;
  let activeImageIndex = 0;

  function optionsHtml(){
    if(!product.options || !Object.keys(product.options).length) return '';
    return Object.entries(product.options).map(([group, values]) => `
      <div class="option-group">
        <label class="group-label">${group}</label>
        <div class="option-pills" data-group="${group}">
          ${values.map(v => `<button class="option-pill ${selectedOptions[group]===v ? 'selected':''}" data-value="${v}">${v}</button>`).join('')}
        </div>
      </div>
    `).join('');
  }

  function tiersHtml(){
    if(!hasTiers) return '';
    return `
      <div class="option-group">
        <label class="group-label">Quantidade</label>
        <div class="option-pills" id="tierPills">
          ${product.tiers.map(t => `
            <button class="option-pill tier-pill ${selectedTier.qty===t.qty ? 'selected':''}" data-qty="${t.qty}">
              ${t.qty} unidades
            </button>
          `).join('')}
        </div>
      </div>
    `;
  }

  function galleryHtml(){
    if(galleryImages){
      return `
        <div class="gallery-main"><img src="${galleryImages[activeImageIndex]}" alt="${product.name}" style="width:100%;height:100%;object-fit:cover;"></div>
        <div class="gallery-thumbs">
          ${galleryImages.map((img, i) => `
            <div class="gallery-thumb ${i===activeImageIndex ? 'active':''}" data-index="${i}">
              <img src="${img}" alt="${product.name}" style="width:100%;height:100%;object-fit:cover;border-radius:6px;">
            </div>
          `).join('')}
        </div>
      `;
    }
    return `
      <div class="gallery-main">${product.icon}</div>
      <div class="gallery-thumbs">
        <div class="gallery-thumb active">${product.icon}</div>
        <div class="gallery-thumb">🖼️</div>
        <div class="gallery-thumb">✨</div>
      </div>
    `;
  }

  function currentPrice(){
    return hasTiers ? selectedTier.price : product.price;
  }

  function renderDetail(){
    document.getElementById('productDetail').innerHTML = `
      <div class="fade-in">
        ${galleryHtml()}
      </div>
      <div class="fade-in">
        <div class="detail-category">${product.category}</div>
        <h1>${product.name}</h1>
        <div class="detail-price">${hasTiers ? `<span class="price-label">A partir de</span> ` : ''}${formatBRL(currentPrice())}</div>
        <p class="detail-desc detail-desc-short">${product.shortDesc}</p>

        ${optionsHtml()}
        ${tiersHtml()}

        ${!hasTiers ? `
        <div class="qty-selector">
          <label class="group-label" style="margin:0;">Quantidade</label>
          <div class="qty-box">
            <button id="qtyMinus">−</button>
            <span id="qtyValue">${quantity}</span>
            <button id="qtyPlus">+</button>
          </div>
        </div>` : ''}

        <div class="detail-actions">
          <button class="btn btn-primary btn-block" id="addToCartBtn">Comprar</button>
        </div>
      </div>
    `;

    document.querySelectorAll('.option-pills:not(#tierPills)').forEach(group => {
      group.addEventListener('click', (e) => {
        if(e.target.classList.contains('option-pill')){
          selectedOptions[group.dataset.group] = e.target.dataset.value;
          renderDetail();
        }
      });
    });

    if(hasTiers){
      document.getElementById('tierPills').addEventListener('click', (e) => {
        const btn = e.target.closest('.tier-pill');
        if(btn){
          const qty = parseInt(btn.dataset.qty, 10);
          selectedTier = product.tiers.find(t => t.qty === qty);
          renderDetail();
        }
      });
    }

    if(galleryImages){
      document.querySelectorAll('.gallery-thumb').forEach(thumb => {
        thumb.addEventListener('click', () => {
          activeImageIndex = parseInt(thumb.dataset.index, 10);
          renderDetail();
        });
      });
    } else {
      const qtyMinus = document.getElementById('qtyMinus');
      const qtyPlus = document.getElementById('qtyPlus');
      if(qtyMinus) qtyMinus.addEventListener('click', () => {
        quantity = Math.max(1, quantity - 1);
        document.getElementById('qtyValue').textContent = quantity;
      });
      if(qtyPlus) qtyPlus.addEventListener('click', () => {
        quantity += 1;
        document.getElementById('qtyValue').textContent = quantity;
      });
    }

    document.getElementById('addToCartBtn').addEventListener('click', () => {
      let qtyLabel;
      if(hasTiers){
        const opts = { ...selectedOptions, Kit: `${selectedTier.qty} unidades` };
        addToCart(product.id, 1, opts, selectedTier.price);
        qtyLabel = `${selectedTier.qty} unidades`;
      } else {
        addToCart(product.id, quantity, selectedOptions);
        qtyLabel = `${quantity}x`;
      }
      showPurchaseModal({
        icon: '🎉',
        title: 'Adicionado ao carrinho!',
        message: `${product.name} — ${qtyLabel}`,
        primaryLabel: 'Ir para o carrinho',
        secondaryLabel: 'Continuar comprando',
        onPrimary: () => { window.location.href = 'carrinho.html'; }
      });
    });
  }

  renderDetail();

  // Descrição completa, abaixo da dobra principal
  document.getElementById('detailFull').innerHTML = `
    <div class="detail-full-inner">
      <h3>Detalhes do produto</h3>
      <p>${product.fullDesc.split('\n').filter(Boolean).map(p => p.trim()).join('</p><p>')}</p>
    </div>
  `;

  // Relacionados: mesma categoria, excluindo o atual
  const related = PRODUCTS.filter(p => p.category === product.category && p.id !== product.id).slice(0,3);
  const fallback = PRODUCTS.filter(p => p.id !== product.id).slice(0,3);
  const relatedList = related.length ? related : fallback;
  document.getElementById('relatedGrid').innerHTML = relatedList.map(p => `
    <div class="product-card">
      <a href="produto.html?id=${p.id}" class="product-card-link">
        <div class="product-thumb">${productCardThumbHtml(p)}</div>
        <div class="product-info">
          <div class="product-category">${p.category}</div>
          <h3>${p.name}</h3>
          <p class="desc">${p.shortDesc}</p>
          <div class="product-price-row"><span class="product-price">${getDisplayPrice(p).label ? `<span class='price-label'>${getDisplayPrice(p).label}</span>` : ''}${getDisplayPrice(p).value}</span></div>
        </div>
      </a>
      <div class="product-card-actions">
        <button class="btn btn-primary btn-sm btn-block" onclick="handleBuyClick(event,'${p.id}')">Comprar</button>
      </div>
    </div>
  `).join('');
</script>
</body>
</html>
