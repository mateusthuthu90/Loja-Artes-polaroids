<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pedido confirmado | Artes Polaroids</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<div id="site-header"></div>

<section class="section">
  <div class="container" id="confirmationContainer">
    <!-- preenchido via JS -->
  </div>
</section>

<div id="site-footer"></div>

<script src="js/products.js"></script>
<script src="js/cart.js"></script>
<script src="js/main.js"></script>
<script>
  renderHeader('carrinho');
  renderFooter();

  const raw = localStorage.getItem('ap_last_order');
  const container = document.getElementById('confirmationContainer');

  if(!raw){
    container.innerHTML = `
      <div class="empty-state">
        <div class="icon">🧾</div>
        <h3 style="margin-bottom:8px;">Nenhum pedido recente encontrado</h3>
        <p style="margin-bottom:20px;">Que tal começar um novo pedido?</p>
        <a href="produtos.html" class="btn btn-primary">Ver produtos</a>
      </div>
    `;
  } else {
    const order = JSON.parse(raw);
    container.innerHTML = `
      <div class="confirmation-box fade-in">
        <div class="big-icon">❤️</div>
        <h1>Pedido recebido!</h1>
        <p style="color:var(--text-muted);">Obrigado por confiar suas memórias à Artes Polaroids.</p>
        <div class="order-number">Pedido #${order.orderNumber}</div>

        <div class="status-track">
          <div class="status-step done">
            <div class="bullet">✓</div>
            Pedido recebido
          </div>
          <div class="status-line"></div>
          <div class="status-step">
            <div class="bullet">2</div>
            Em produção
          </div>
          <div class="status-line"></div>
          <div class="status-step">
            <div class="bullet">3</div>
            Enviado
          </div>
        </div>

        <div class="confirmation-summary">
          ${order.items.map(i => `
            <div class="summary-line"><span>${i.name} x${i.quantity}</span><span>${formatBRL(i.price*i.quantity)}</span></div>
          `).join('')}
          <div class="summary-line total"><span>Total</span><span>${formatBRL(order.total)}</span></div>
        </div>

        <p style="font-size:0.88rem; color:var(--text-muted); margin-bottom:24px;">
          Em breve, você poderá acompanhar cada etapa do seu pedido por aqui. Por enquanto, envie suas fotos diretamente pelo WhatsApp para começarmos a produção. 📸
        </p>

        <a href="https://wa.me/5533999999999?text=${encodeURIComponent('Olá! Fiz o pedido #' + order.orderNumber + ' na Artes Polaroids e vou enviar minhas fotos por aqui 📸')}" target="_blank" rel="noopener" class="btn btn-whatsapp btn-block">
          💬 Enviar minhas fotos no WhatsApp
        </a>
        <div style="margin-top:14px;">
          <a href="produtos.html" class="btn btn-ghost btn-sm">Continuar comprando</a>
        </div>
      </div>
    `;
  }
</script>
</body>
</html>
