<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Carrinho | Artes Polaroids</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<div id="site-header"></div>

<section class="page-hero" style="padding-bottom:20px;">
  <div class="container">
    <span class="section-eyebrow">Seu pedido</span>
    <h1>Carrinho</h1>
  </div>
</section>

<section class="section" style="padding-top:10px;">
  <div class="container" id="cartContainer">
    <!-- preenchido via JS -->
  </div>
</section>

<div id="site-footer"></div>

<script src="js/products.js"></script>
<script src="js/cart.js"></script>
<script src="js/main.js"></script>
<script>
  renderHeader('carrinho');
  renderFooter();

  let appliedCouponPct = 0;
  let appliedCouponCode = '';

  function renderCart(){
    const cart = getCart();
    const container = document.getElementById('cartContainer');

    if(cart.length === 0){
      container.innerHTML = `
        <div class="empty-state">
          <div class="icon">🛍️</div>
          <h3 style="margin-bottom:8px;">Seu carrinho está vazio</h3>
          <p style="margin-bottom:20px;">Que tal escolher uma lembrancinha pra começar?</p>
          <a href="produtos.html" class="btn btn-primary">Ver produtos</a>
        </div>
      `;
      return;
    }

    const subtotal = getCartSubtotal();
    const discount = subtotal * appliedCouponPct;

    const shipping = getShipping() || { method: null, cep: '', fee: null };
    let shippingFee = 0;
    let shippingLabel = 'A calcular';
    let canCheckout = true;

    if(shipping.method === 'pickup'){
      shippingFee = 0;
      shippingLabel = 'Retirar na loja';
    } else if(shipping.method === 'delivery'){
      if(shipping.fee !== null && shipping.fee !== undefined){
        shippingFee = shipping.fee;
        shippingLabel = shippingFee === 0 ? 'Grátis (acima de R$100)' : formatBRL(shippingFee);
      } else {
        shippingLabel = 'Informe o CEP';
        canCheckout = false;
      }
    } else {
      canCheckout = false;
    }

    const total = Math.max(0, subtotal - discount + shippingFee);

    container.innerHTML = `
      <div class="cart-layout">
        <div class="cart-list">
          ${cart.map((item, index) => {
            const p = findProduct(item.productId);
            if(!p) return '';
            const optsText = Object.entries(item.selectedOptions || {}).map(([k,v]) => `${k}: ${v}`).join(' · ');
            return `
              <div class="cart-row">
                <div class="thumb">${productThumbImg(p)}</div>
                <div class="meta">
                  <div class="name">${p.name}</div>
                  ${optsText ? `<div class="opt">${optsText}</div>` : ''}
                  <div class="unit-price">${formatBRL(getItemUnitPrice(item))} cada</div>
                </div>
                <div class="qty-box">
                  <button data-action="minus" data-index="${index}">−</button>
                  <span>${item.quantity}</span>
                  <button data-action="plus" data-index="${index}">+</button>
                </div>
                <div class="row-total">${formatBRL(getItemUnitPrice(item) * item.quantity)}</div>
                <button class="remove-btn" data-action="remove" data-index="${index}" title="Remover">🗑️</button>
              </div>
            `;
          }).join('')}
        </div>

        <div class="summary-card">
          <h3>Resumo do pedido</h3>
          <div class="summary-line"><span>Subtotal</span><span>${formatBRL(subtotal)}</span></div>
          ${discount > 0 ? `<div class="summary-line"><span>Cupom (${appliedCouponCode})</span><span>− ${formatBRL(discount)}</span></div>` : ''}
          <div class="summary-line"><span>Frete</span><span>${shippingLabel}</span></div>
          <div class="summary-line total"><span>Total</span><span>${formatBRL(total)}</span></div>

          <div class="shipping-block">
            <label class="group-label" style="display:block;margin-bottom:8px;">Entrega</label>
            <label class="shipping-option">
              <input type="radio" name="shipMethod" value="pickup" ${shipping.method === 'pickup' ? 'checked' : ''}>
              Retirar na loja <span class="tag-free">Grátis</span>
            </label>
            <label class="shipping-option">
              <input type="radio" name="shipMethod" value="delivery" ${shipping.method === 'delivery' ? 'checked' : ''}>
              Enviar pelo Correios
            </label>
            <div id="cepRow" class="cep-row" style="display:${shipping.method === 'delivery' ? 'flex' : 'none'};">
              <input type="text" id="cepInput" placeholder="Seu CEP" value="${shipping.cep || ''}" maxlength="9">
              <button class="btn btn-outline btn-sm" id="calcFreteBtn">Calcular</button>
            </div>
            <div id="freteMsg"></div>
          </div>

          <div class="coupon-row">
            <input type="text" id="couponInput" placeholder="Cupom de desconto">
            <button class="btn btn-outline btn-sm" id="applyCouponBtn">Aplicar</button>
          </div>
          <div id="couponMsg"></div>

          <a href="${canCheckout ? 'checkout.html' : '#'}" class="btn btn-primary btn-block ${canCheckout ? '' : 'btn-disabled'}" style="margin-top:16px;" id="goCheckoutBtn">Continuar para pagamento</a>
          <p style="font-size:0.78rem;color:var(--text-soft);text-align:center;margin-top:10px;">
            Frete grátis para compras acima de R$ 100,00
          </p>
        </div>
      </div>
    `;

    const goCheckoutBtn = document.getElementById('goCheckoutBtn');
    if(goCheckoutBtn && !canCheckout){
      goCheckoutBtn.addEventListener('click', (e) => {
        e.preventDefault();
        showToast('⚠️ Escolha uma forma de entrega antes de continuar');
      });
    }

    container.querySelectorAll('[data-action]').forEach(btn => {
      btn.addEventListener('click', () => {
        const index = parseInt(btn.dataset.index, 10);
        const action = btn.dataset.action;
        if(action === 'plus') updateCartItemQty(index, 1);
        if(action === 'minus') updateCartItemQty(index, -1);
        if(action === 'remove') removeCartItem(index);
        renderCart();
      });
    });

    container.querySelectorAll('input[name="shipMethod"]').forEach(radio => {
      radio.addEventListener('change', () => {
        if(radio.value === 'pickup'){
          setShipping({ method: 'pickup', cep: '', fee: 0 });
        } else {
          setShipping({ method: 'delivery', cep: shipping.cep || '', fee: null });
        }
        renderCart();
      });
    });

    const calcFreteBtn = document.getElementById('calcFreteBtn');
    if(calcFreteBtn){
      calcFreteBtn.addEventListener('click', () => {
        const cep = document.getElementById('cepInput').value;
        const fee = calculateShippingFee(cep, subtotal);
        const msgEl = document.getElementById('freteMsg');
        if(fee === null){
          msgEl.innerHTML = `<div class="coupon-msg err">CEP inválido. Digite os 8 números do seu CEP.</div>`;
          return;
        }
        setShipping({ method: 'delivery', cep, fee });
        renderCart();
      });
    }

    const applyCouponBtn = document.getElementById('applyCouponBtn');
    if(applyCouponBtn){
      applyCouponBtn.addEventListener('click', () => {
        const code = document.getElementById('couponInput').value;
        const pct = applyCouponMock(code);
        const msgEl = document.getElementById('couponMsg');
        if(pct > 0){
          appliedCouponPct = pct;
          appliedCouponCode = code.trim().toUpperCase();
          msgEl.innerHTML = `<div class="coupon-msg ok">Cupom aplicado: ${pct*100}% de desconto 🎉</div>`;
          renderCart();
        } else {
          appliedCouponPct = 0;
          msgEl.innerHTML = `<div class="coupon-msg err">Cupom inválido ou expirado.</div>`;
        }
      });
    }
  }

  renderCart();
</script>
</body>
</html>
